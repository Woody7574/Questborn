        name: "<#ff5555>Requirements apply"
        lore:
          - "{requirements}"
          - ""
          - "<#cccccc>You do not meet the"
          - "<#cccccc>requirements for this"
          - "<#cccccc>quest type."

      back-to-dialogue:
        slot: 40
        material: BOOK
        name: "<#ffe380>Return to Dialogue"
        lore:
          - "<#cccccc>Click to return to the conversation"
          - "<#cccccc>with the character"

