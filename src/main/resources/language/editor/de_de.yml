    save_error: '{prefix}<#c96a6a>✖ <#ffffff>Fehler beim Speichern von dialogues.yml!'
    tutorial_footer: '<#6e6e6e>=============================

      '
    tutorial_header: '

      <#6e6e6e>=== <#7dd3ff>Wie man Dialoge erstellt <#6e6e6e>==='
    tutorial_step1_title: '<#ffd470>Schritt 1: Dialogstart'
    tutorial_step1_lore:
    - '<#a8a8a8>Jeder Dialog muss einen Startpunkt haben.'
    - '<#a8a8a8>Klicke auf <#a7ff99>''Dialogknoten''<#a8a8a8> und erstelle'
    - '<#a8a8a8>den ersten Knoten mit der ID <#a7ff99>''start''<#a8a8a8>.'
    - '<#a8a8a8>Hier wird der NPC das Gespräch beginnen.'
    tutorial_step2_title: '<#ffd470>Schritt 2: Knotentext'
    tutorial_step2_lore:
    - '<#a8a8a8>Nach dem Erstellen eines Knotens, klicke darauf.'
    - '<#a8a8a8>Richte den Text ein, den der NPC sprechen wird.'
    - '<#a8a8a8>Du kannst Farbcodes und'
    - '<#a8a8a8>Platzhalter verwenden (z. B. <#a7ff99>{player}<#a8a8a8>).'
    tutorial_step3_title: '<#ffd470>Schritt 3: Antwortmöglichkeiten'
    tutorial_step3_lore:
    - '<#a8a8a8>Um den Dialog interaktiv zu machen, füge'
    - '<#a7ff99>Antwortmöglichkeiten <#a8a8a8>für den Spieler hinzu.'
    - '<#a8a8a8>Gehe zu den Knoteneinstellungen und'
    - '<#a8a8a8>erstelle mehrere mögliche Antworten.'
    tutorial_step4_title: '<#ffd470>Schritt 4: Links und Übergänge'
    tutorial_step4_lore:
    - '<#a8a8a8>Jede Spielerantwort muss zu'
    - '<#a8a8a8>einem anderen NPC-Knoten führen oder den Dialog beenden.'
    - '<#a8a8a8>Verlinke jede Antwort mit der ID des'
    - '<#a8a8a8>nächsten Knotens.'
    tutorial_step5_title: '<#ffd470>Schritt 5: Bedingungen (Conditions)'
    tutorial_step5_lore:
    - '<#a8a8a8>Einige Antworten können vor dem Spieler verborgen sein.'
    - '<#a8a8a8>In den Antworteinstellungen kannst du Anforderungen angeben:'
    - '<#a8a8a8>Eine Berechtigung haben (permission)'
    - '<#a8a8a8>oder einen bestimmten Quest-Status.'
    tutorial_step6_title: '<#ffd470>Schritt 6: Aktionen (Actions)'
    tutorial_step6_lore:
    - '<#a8a8a8>Die Wahl einer Antwort kann bestimmte Ereignisse auslösen.'
    - '<#a8a8a8>Neben dem Springen zum nächsten Knoten'
    - '<#a8a8a8>kannst du automatisch eine Quest starten oder abgeben,'
    - '<#a8a8a8>oder einen Befehl im Namen des Spielers/der Konsole ausführen.'
    tutorial_step7_title: '<#ffd470>Schritt 7: Dialog-Validator'
    tutorial_step7_lore:
    - '<#a8a8a8>Wenn der Dialog fertig ist, benutze unbedingt den'
    - '<#a7ff99>Validator <#a8a8a8>im Hauptmenü des Editors.'
    - '<#a8a8a8>Er überprüft deinen Dialog auf'
    - '<#a8a8a8>fehlerhafte Links und unzugängliche Knoten.'
    update_period_click:
