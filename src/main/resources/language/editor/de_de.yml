      INCREASE_DAMAGE: <#cccccc>Erhöht den Nahkampfschaden.
      INFESTED: <#cccccc>Spawnt Silberfischchen bei erlittenem Schaden.
      INVISIBILITY: <#cccccc>Macht den Spieler unsichtbar.
      JUMP: <#cccccc>Erhöht die Sprunghöhe.
