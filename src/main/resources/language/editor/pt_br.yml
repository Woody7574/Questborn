      HEALTH_BOOST: <#cccccc>Adiciona corações de vida extras.
      HERO_OF_THE_VILLAGE: <#cccccc>Descontos de aldeões.
      HUNGER: <#cccccc>Esgota a fome mais rápido.
      INCREASE_DAMAGE: <#cccccc>Aumenta o dano corpo a corpo.
      INFESTED: <#cccccc>Gera traças ao sofrer dano.
      INVISIBILITY: <#cccccc>Torna o jogador invisível.
      JUMP: <#cccccc>Aumenta a altura do salto.
      LEVITATION: <#cccccc>Faz o jogador flutuar para cima.
      LUCK: <#cccccc>Aumenta a sorte.
      NIGHT_VISION: <#cccccc>Permite ver no escuro.
      OOZING: <#cccccc>Gera slimes ao morrer.
      POISON: <#cccccc>Causa dano gradualmente (não pode matar).
      RAID_OMEN: <#cccccc>Desencadeia uma invasão ao se aproximar de uma vila.
