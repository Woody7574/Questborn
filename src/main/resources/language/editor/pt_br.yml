      '
    tutorial_header: '
      <#6e6e6e>=== <#7dd3ff>Como criar diálogos <#6e6e6e>==='
    tutorial_step1_title: '<#ffd470>Passo 1: Início do diálogo'
    tutorial_step1_lore:
    - '<#a8a8a8>Todo diálogo deve ter um ponto de partida.'
    - '<#a8a8a8>Clique em <#a7ff99>''Nós do diálogo''<#a8a8a8> e crie'
    - '<#a8a8a8>o primeiro nó com o ID <#a7ff99>''start''<#a8a8a8>.'
    - '<#a8a8a8>Aqui é onde o NPC iniciará a conversa.'
    tutorial_step2_title: '<#ffd470>Passo 2: Texto do nó'
    tutorial_step2_lore:
    - '<#a8a8a8>Após criar um nó, clique nele.'
    - '<#a8a8a8>Configure o texto que o NPC falará.'
    - '<#a8a8a8>Você pode usar códigos de cores e'
    - '<#a8a8a8>marcadores (ex: <#a7ff99>{player}<#a8a8a8>).'
    tutorial_step3_title: '<#ffd470>Passo 3: Opções de resposta'
    tutorial_step3_lore:
    - '<#a8a8a8>Para tornar o diálogo interativo, adicione'
    - '<#a7ff99>opções de resposta <#a8a8a8>para o jogador.'
    - '<#a8a8a8>Vá até as configurações do nó e'
    - '<#a8a8a8>crie várias respostas possíveis.'
    tutorial_step4_title: '<#ffd470>Passo 4: Links e transições'
    tutorial_step4_lore:
    - '<#a8a8a8>Cada resposta do jogador deve levar a'
    - '<#a8a8a8>outro nó do NPC ou encerrar o diálogo.'
    - '<#a8a8a8>Vincule cada resposta ao ID do'
    - '<#a8a8a8>próximo nó.'
    tutorial_step5_title: '<#ffd470>Passo 5: Condições (Conditions)'
    tutorial_step5_lore:
    - '<#a8a8a8>Algumas respostas podem ser ocultadas do jogador.'
    - '<#a8a8a8>Nas configurações de resposta, você pode especificar'
    - '<#a8a8a8>requisitos: ter uma permissão (permission)'
    - '<#a8a8a8>ou um estado específico da missão.'
    tutorial_step6_title: '<#ffd470>Passo 6: Ações (Actions)'
    tutorial_step6_lore:
    - '<#a8a8a8>Escolher uma resposta pode desencadear certos eventos.'
    - '<#a8a8a8>Além de pular para o próximo nó,'
    - '<#a8a8a8>você pode iniciar ou entregar automaticamente uma missão,'
    - '<#a8a8a8>ou executar um comando em nome do jogador/console.'
    tutorial_step7_title: '<#ffd470>Passo 7: Validador de Diálogo'
    tutorial_step7_lore:
    - '<#a8a8a8>Quando o diálogo estiver pronto, certifique-se de usar'
    - '<#a7ff99>o Validador <#a8a8a8>no menu principal do editor.'
    - '<#a8a8a8>Ele verificará seu diálogo em busca de'
    - '<#a8a8a8>links quebrados e nós inacessíveis.'
