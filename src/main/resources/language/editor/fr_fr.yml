    descriptions:
      ABSORPTION: <#cccccc>Donne des cœurs dorés supplémentaires.
      BAD_OMEN: <#cccccc>Déclenche un raid à l'entrée d'un village.
      BLINDNESS: <#cccccc>Diminue la visibilité du joueur.
      BREATH_OF_THE_NAUTILUS: <#cccccc>Donne la respiration aquatique (Conduit).
      CONDUIT_POWER: <#cccccc>Donne la respiration aquatique, la vision et la célérité.
      CONFUSION: <#cccccc>Provoque un effet vertigineux.
      DAMAGE_RESISTANCE: <#cccccc>Réduit les dégâts reçus.
      DARKNESS: <#cccccc>Assombrit la vision du joueur.
      DOLPHINS_GRACE: <#cccccc>Augmente la vitesse de nage.
      FAST_DIGGING: <#cccccc>Augmente la vitesse d'extraction.
      FIRE_RESISTANCE: <#cccccc>Accorde l'immunité au feu et à la lave.
      GLOWING: <#cccccc>Met en évidence le contour du joueur.
      HARM: <#cccccc>Inflige instantanément des dégâts.
      HEAL: <#cccccc>Restaure instantanément la santé.
      HEALTH_BOOST: <#cccccc>Ajoute des cœurs de santé supplémentaires.
      HERO_OF_THE_VILLAGE: <#cccccc>Réductions auprès des villageois.
      HUNGER: <#cccccc>Épuise la faim plus rapidement.
      INCREASE_DAMAGE: <#cccccc>Augmente les dégâts de mêlée.
      INFESTED: <#cccccc>Génère un poisson d'argent en subissant des dégâts.
      INVISIBILITY: <#cccccc>Rend le joueur invisible.
      JUMP: <#cccccc>Augmente la hauteur de saut.
      LEVITATION: <#cccccc>Fait flotter le joueur vers le haut.
      LUCK: <#cccccc>Augmente la chance.
      NIGHT_VISION: <#cccccc>Permet de voir dans le noir.
      OOZING: <#cccccc>Génère des slimes à la mort.
      POISON: <#cccccc>Inflige progressivement des dégâts (ne peut pas tuer).
      RAID_OMEN: <#cccccc>Déclenche un raid à l'approche d'un village.
      REGENERATION: <#cccccc>Restaure progressivement la santé.
      SATURATION: <#cccccc>Restaure instantanément la faim.
      SLOW: <#cccccc>Diminue la vitesse de déplacement.
      SLOW_DIGGING: <#cccccc>Diminue la vitesse d’extraction.
      SLOW_FALLING: <#cccccc>Ralentit la vitesse de chute.
      SPEED: <#cccccc>Augmente la vitesse de déplacement.
      TRIAL_OMEN: <#cccccc>Augmente la difficulté des épreuves.
      UNLUCK: <#cccccc>Diminue la chance.
      WATER_BREATHING: <#cccccc>Permet de respirer sous l'eau.
      WEAKNESS: <#cccccc>Réduit les dégâts infligés.
      WEAVING: <#cccccc>Génère des toiles d'araignées à la mort.
      WIND_CHARGED: <#cccccc>Déclenche une explosion de vent à la mort.
      WITHER: <#cccccc>Inflige progressivement des dégâts (peut tuer).
