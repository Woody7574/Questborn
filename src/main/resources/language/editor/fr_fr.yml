    tutorial_footer: '<#6e6e6e>=============================

      '
    tutorial_header: '

      <#6e6e6e>=== <#7dd3ff>Comment créer des dialogues <#6e6e6e>==='
    tutorial_step1_title: '<#ffd470>Étape 1 : Début du dialogue'
    tutorial_step1_lore:
    - '<#a8a8a8>Chaque dialogue doit avoir un point de départ.'
    - '<#a8a8a8>Cliquez <#a7ff99>''Nœuds de dialogue''<#a8a8a8> et créer'
    - '<#a8a8a8>le premier nœud avec ID <#a7ff99>''commencer''<#a8a8a8>.'
    - '<#a8a8a8>C''est ici que le PNJ démarrera la conversation.'
    tutorial_step2_title: '<#ffd470>Étape 2 : Texte du nœud'
    tutorial_step2_lore:
    - '<#a8a8a8>Après avoir créé un nœud, cliquez dessus.'
    - '<#a8a8a8>Configurez le texte que le PNJ prononcera.'
    - '<#a8a8a8>Vous pouvez utiliser des codes de couleur et'
    - '<#a8a8a8>espaces réservés (par ex. <#a7ff99>{player}<#a8a8a8>).'
    tutorial_step3_title: '<#ffd470>Étape 3 : Options de réponse'
    tutorial_step3_lore:
    - '<#a8a8a8>Pour rendre le dialogue interactif, ajoutez'
    - '<#a7ff99>options de réponse <#a8a8a8>pour le joueur.'
    - '<#a8a8a8>Accédez aux paramètres du nœud et'
    - '<#a8a8a8>créer plusieurs réponses possibles.'
    tutorial_step4_title: '<#ffd470>Étape 4 : Liens et transitions'
    tutorial_step4_lore:
    - '<#a8a8a8>Chaque réponse du joueur doit conduire à'
    - '<#a8a8a8>un autre nœud PNJ ou mettre fin au dialogue.'
    - '<#a8a8a8>Liez chaque réponse à l''identifiant de'
    - '<#a8a8a8>le nœud suivant.'
    tutorial_step5_title: '<#ffd470>Étape 5 : Conditions (Conditions)'
    tutorial_step5_lore:
    - '<#a8a8a8>Certaines réponses peuvent être masquées au joueur.'
    - '<#a8a8a8>Dans les paramètres de réponse, vous pouvez spécifier'
    - '<#a8a8a8>exigences : avoir une autorisation (permission)'
    - '<#a8a8a8>ou un état de quête spécifique.'
    tutorial_step6_title: '<#ffd470>Étape 6 : Actions (Actions)'
    tutorial_step6_lore:
    - '<#a8a8a8>Choisir une réponse peut déclencher certains événements.'
    - '<#a8a8a8>En plus de passer au nœud suivant,'
    - '<#a8a8a8>vous pouvez démarrer ou remettre automatiquement une quête,'
    - '<#a8a8a8>ou exécuter une commande au nom du lecteur/console.'
    tutorial_step7_title: '<#ffd470>Étape 7 : Validateur de dialogue'
    tutorial_step7_lore:
    - '<#a8a8a8>Lorsque le dialogue est prêt, assurez-vous d''utiliser'
    - '<#a7ff99>Validateur <#a8a8a8>dans le menu principal de l''éditeur.'
    - '<#a8a8a8>Il vérifiera votre dialogue pour'
    - '<#a8a8a8>liens rompus et nœuds inaccessibles.'
    update_period_click:
