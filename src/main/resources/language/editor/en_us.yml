    save_error: '{prefix}<#c96a6a>✖ <#ffffff>Error saving dialogues.yml!'
    tutorial_footer: '<#6e6e6e>=============================

      '
    tutorial_header: '

      <#6e6e6e>=== <#7dd3ff>How to create dialogues <#6e6e6e>==='
    tutorial_step1_title: '<#ffd470>Step 1: Dialogue start'
    tutorial_step1_lore:
    - '<#a8a8a8>Every dialogue must have a starting point.'
    - '<#a8a8a8>Click <#a7ff99>''Dialogue nodes''<#a8a8a8> and create'
    - '<#a8a8a8>the first node with ID <#a7ff99>''start''<#a8a8a8>.'
    - '<#a8a8a8>This is where the NPC will start the conversation.'
    tutorial_step2_title: '<#ffd470>Step 2: Node text'
    tutorial_step2_lore:
    - '<#a8a8a8>After creating a node, click on it.'
    - '<#a8a8a8>Set up the text the NPC will speak.'
    - '<#a8a8a8>You can use color codes and'
    - '<#a8a8a8>placeholders (e.g. <#a7ff99>{player}<#a8a8a8>).'
    tutorial_step3_title: '<#ffd470>Step 3: Reply options'
    tutorial_step3_lore:
    - '<#a8a8a8>To make the dialogue interactive, add'
    - '<#a7ff99>reply options <#a8a8a8>for the player.'
    - '<#a8a8a8>Go to the node settings and'
    - '<#a8a8a8>create several possible replies.'
    tutorial_step4_title: '<#ffd470>Step 4: Links and transitions'
    tutorial_step4_lore:
    - '<#a8a8a8>Each player reply must lead to'
    - '<#a8a8a8>another NPC node or end the dialogue.'
    - '<#a8a8a8>Link each reply to the ID of'
    - '<#a8a8a8>the next node.'
    tutorial_step5_title: '<#ffd470>Step 5: Conditions (Conditions)'
    tutorial_step5_lore:
    - '<#a8a8a8>Some replies can be hidden from the player.'
    - '<#a8a8a8>In the reply settings you can specify'
    - '<#a8a8a8>requirements: having a permission (permission)'
    - '<#a8a8a8>or a specific quest state.'
    tutorial_step6_title: '<#ffd470>Step 6: Actions (Actions)'
    tutorial_step6_lore:
    - '<#a8a8a8>Choosing a reply can trigger certain events.'
    - '<#a8a8a8>Besides jumping to the next node,'
    - '<#a8a8a8>you can automatically start or hand in a quest,'
    - '<#a8a8a8>or execute a command on behalf of the player/console.'
    tutorial_step7_title: '<#ffd470>Step 7: Dialogue Validator'
    tutorial_step7_lore:
    - '<#a8a8a8>When the dialogue is ready, be sure to use'
    - '<#a7ff99>Validator <#a8a8a8>in the editor''s main menu.'
    - '<#a8a8a8>It will check your dialogue for'
    - '<#a8a8a8>broken links and inaccessible nodes.'
    update_period_click:
    - <#a7ff99>LMB <#cccccc>- Add 1 tick
    - <#a7ff99>RMB <#cccccc>- Remove 1 tick
    - <#ffe999>Shift+LMB <#cccccc>- Add 10 ticks
    - <#ffe999>Shift+RMB <#cccccc>- Remove 10 ticks
    - <#d9a752>Swap (F) <#cccccc>- Enter manually
