    tutorial_step1_title: '<#ffd470>Шаг 1: Начало диалога'
    tutorial_step1_lore:
    - '<#a8a8a8>Каждый диалог должен иметь начальную точку.'
    - '<#a8a8a8>Нажмите <#a7ff99>''Реплики диалога''<#a8a8a8> и создайте'
    - '<#a8a8a8>первую реплику с ID <#a7ff99>''start''<#a8a8a8>.'
    - '<#a8a8a8>Именно с нее NPC начнет разговор.'
    tutorial_step2_title: '<#ffd470>Шаг 2: Текст реплики'
    tutorial_step2_lore:
    - '<#a8a8a8>После создания узла, нажмите на него.'
    - '<#a8a8a8>Настройте текст, который будет произносить NPC.'
    - '<#a8a8a8>Можно использовать цветовые коды и'
    - '<#a8a8a8>плейсхолдеры (например, <#a7ff99>{player}<#a8a8a8>).'
    tutorial_step3_title: '<#ffd470>Шаг 3: Варианты ответов'
    tutorial_step3_lore:
    - '<#a8a8a8>Чтобы диалог был интерактивным, добавьте'
    - '<#a7ff99>варианты ответов <#a8a8a8>для игрока.'
    - '<#a8a8a8>Зайдите в настройки узла и'
    - '<#a8a8a8>создайте несколько возможных ответов.'
    tutorial_step4_title: '<#ffd470>Шаг 4: Линки и переходы'
    tutorial_step4_lore:
    - '<#a8a8a8>Каждый ответ игрока должен вести к'
    - '<#a8a8a8>другой реплике NPC или же завершать диалог.'
    - '<#a8a8a8>Привяжите каждый ответ к ID'
    - '<#a8a8a8>следующего узла.'
    tutorial_step5_title: '<#ffd470>Шаг 5: Условия (Conditions)'
    tutorial_step5_lore:
    - '<#a8a8a8>Некоторые ответы можно скрыть от игрока.'
    - '<#a8a8a8>В настройках ответа можно указать'
    - '<#a8a8a8>требования: наличие разрешения (permission)'
    - '<#a8a8a8>или определенный статус квеста.'
    tutorial_step6_title: '<#ffd470>Шаг 6: Действия (Actions)'
    tutorial_step6_lore:
    - '<#a8a8a8>Выбор ответа может вызывать определенные события.'
    - '<#a8a8a8>Помимо перехода к следующему узлу,'
    - '<#a8a8a8>вы можете автоматически начать или сдать квест,'
    - '<#a8a8a8>или выполнить команду от имени игрока/консоли.'
    tutorial_step7_title: '<#ffd470>Шаг 7: Валидатор диалога'
