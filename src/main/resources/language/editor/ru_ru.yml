    - '<#a8a8a8>Когда диалог готов, обязательно используйте'
    - '<#a7ff99>Валидатор <#a8a8a8>в главном меню редактора.'
    - '<#a8a8a8>Он проверит ваш диалог на наличие'
    - '<#a8a8a8>разорванных связей и недоступных узлов.'
