      - '<#a8a8a8>іншої репліки NPC або ж завершувати діалог.'
      - '<#a8a8a8>Прив''яжіть кожну відповідь до ID'
      - '<#a8a8a8>наступного вузла.'
    tutorial_step5_title: '<#ffd470>Крок 5: Умови (Conditions)'
