    tutorial_step1_title: '<#ffd470>Adım 1: Diyalog başlangıcı'
    tutorial_step1_lore:
    - '<#a8a8a8>Her diyaloğun bir başlangıç noktası olmalıdır.'
    - '<#a8a8a8><#a7ff99>''Diyalog düğümleri''<#a8a8a8>ne tıklayın ve'
    - '<#a8a8a8>ID''si <#a7ff99>''start''<#a8a8a8> olan ilk düğümü oluşturun.'
    - '<#a8a8a8>Bu, NPC''nin konuşmaya başlayacağı yerdir.'
    tutorial_step2_title: '<#ffd470>Adım 2: Düğüm metni'
    tutorial_step2_lore:
    - '<#a8a8a8>Bir düğüm oluşturduktan sonra üzerine tıklayın.'
    - '<#a8a8a8>NPC''nin söyleyeceği metni ayarlayın.'
    - '<#a8a8a8>Renk kodlarını ve'
    - '<#a8a8a8>yer tutucuları (örn. <#a7ff99>{player}<#a8a8a8>) kullanabilirsiniz.'
    tutorial_step3_title: '<#ffd470>Adım 3: Cevap seçenekleri'
    tutorial_step3_lore:
    - '<#a8a8a8>Diyaloğu etkileşimli hale getirmek için, oyuncu'
    - '<#a8a8a8>için <#a7ff99>cevap seçenekleri <#a8a8a8>ekleyin.'
    - '<#a8a8a8>Düğüm ayarlarına gidin ve'
    - '<#a8a8a8>birkaç olası cevap oluşturun.'
    tutorial_step4_title: '<#ffd470>Adım 4: Bağlantılar ve geçişler'
    tutorial_step4_lore:
    - '<#a8a8a8>Her oyuncu cevabı başka bir'
    - '<#a8a8a8>NPC düğümüne çıkmalı veya diyaloğu sonlandırmalıdır.'
    - '<#a8a8a8>Her cevabı bir sonraki düğümün'
    - '<#a8a8a8>ID''sine bağlayın.'
    tutorial_step5_title: '<#ffd470>Adım 5: Koşullar (Conditions)'
    tutorial_step5_lore:
    - '<#a8a8a8>Bazı cevaplar oyuncudan gizlenebilir.'
    - '<#a8a8a8>Cevap ayarlarında şunları belirtebilirsiniz:'
    - '<#a8a8a8>gereksinimler: bir izne sahip olmak (permission)'
    - '<#a8a8a8>veya belirli bir görev durumu.'
    tutorial_step6_title: '<#ffd470>Adım 6: Eylemler (Actions)'
    tutorial_step6_lore:
    - '<#a8a8a8>Bir cevap seçmek belirli etkinlikleri tetikleyebilir.'
    - '<#a8a8a8>Bir sonraki düğüme atlamanın yanı sıra,'
    - '<#a8a8a8>otomatik olarak bir görevi başlatabilir veya teslim edebilir,'
    - '<#a8a8a8>veya oyuncu/konsol adına bir komut yürütebilirsiniz.'
    tutorial_step7_title: '<#ffd470>Adım 7: Diyalog Doğrulayıcı'
    tutorial_step7_lore:
    - '<#a8a8a8>Diyalog hazır olduğunda, editörün ana menüsündeki'
    - '<#a7ff99>Doğrulayıcı<#a8a8a8>yı kullandığınızdan emin olun.'
    - '<#a8a8a8>Bu, diyaloğunuzu kırık bağlantılar'
    - '<#a8a8a8>ve erişilemeyen düğümler için kontrol edecektir.'
