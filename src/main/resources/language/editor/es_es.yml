    tutorial_footer: '<#6e6e6e>=============================

      '
    tutorial_header: '

      <#6e6e6e>=== <#7dd3ff>Cómo crear diálogos <#6e6e6e>==='
    tutorial_step1_title: '<#ffd470>Paso 1: Inicio del diálogo'
    tutorial_step1_lore:
    - '<#a8a8a8>Todo diálogo debe tener un punto de inicio.'
    - '<#a8a8a8>Haz clic en <#a7ff99>''Nodos del diálogo''<#a8a8a8> y crea'
    - '<#a8a8a8>el primer nodo con el ID <#a7ff99>''start''<#a8a8a8>.'
    - '<#a8a8a8>Aquí es donde el NPC empezará la conversación.'
    tutorial_step2_title: '<#ffd470>Paso 2: Texto del nodo'
    tutorial_step2_lore:
    - '<#a8a8a8>Después de crear un nodo, haz clic en él.'
    - '<#a8a8a8>Configura el texto que hablará el NPC.'
    - '<#a8a8a8>Puedes usar códigos de color y'
    - '<#a8a8a8>marcadores de posición (ej. <#a7ff99>{player}<#a8a8a8>).'
    tutorial_step3_title: '<#ffd470>Paso 3: Opciones de respuesta'
    tutorial_step3_lore:
    - '<#a8a8a8>Para hacer el diálogo interactivo, añade'
    - '<#a7ff99>opciones de respuesta <#a8a8a8>para el jugador.'
    - '<#a8a8a8>Ve a los ajustes del nodo y'
    - '<#a8a8a8>crea varias respuestas posibles.'
    tutorial_step4_title: '<#ffd470>Paso 4: Enlaces y transiciones'
    tutorial_step4_lore:
    - '<#a8a8a8>Cada respuesta del jugador debe conducir a'
    - '<#a8a8a8>otro nodo de NPC o terminar el diálogo.'
    - '<#a8a8a8>Enlaza cada respuesta con el ID de'
    - '<#a8a8a8>el siguiente nodo.'
    tutorial_step5_title: '<#ffd470>Paso 5: Condiciones (Conditions)'
    tutorial_step5_lore:
    - '<#a8a8a8>Algunas respuestas pueden estar ocultas para el jugador.'
    - '<#a8a8a8>En los ajustes de la respuesta puedes especificar'
    - '<#a8a8a8>requisitos: tener un permiso (permission)'
    - '<#a8a8a8>o un estado de misión específico.'
    tutorial_step6_title: '<#ffd470>Paso 6: Acciones (Actions)'
    tutorial_step6_lore:
    - '<#a8a8a8>Elegir una respuesta puede desencadenar ciertos eventos.'
    - '<#a8a8a8>Además de saltar al siguiente nodo,'
    - '<#a8a8a8>puedes iniciar o entregar automáticamente una misión,'
    - '<#a8a8a8>o ejecutar un comando en nombre del jugador/consola.'
    tutorial_step7_title: '<#ffd470>Paso 7: Validador de Diálogos'
    tutorial_step7_lore:
    - '<#a8a8a8>Cuando el diálogo esté listo, asegúrate de usar'
    - '<#a7ff99>el Validador <#a8a8a8>en el menú principal del editor.'
    - '<#a8a8a8>Comprobará tu diálogo en busca de'
    - '<#a8a8a8>enlaces rotos y nodos inaccesibles.'
    update_period_click:
