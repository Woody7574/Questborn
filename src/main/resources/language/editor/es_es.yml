    descriptions:
      ABSORPTION: <#cccccc>Da corazones dorados adicionales.
      BAD_OMEN: <#cccccc>Desencadena una incursión al entrar a una aldea.
      BLINDNESS: <#cccccc>Perjudica la visibilidad del jugador.
      BREATH_OF_THE_NAUTILUS: <#cccccc>Otorga respiración acuática (Conducto).
      CONDUIT_POWER: <#cccccc>Otorga respiración acuática, visión y prisa.
      CONFUSION: <#cccccc>Causa un efecto de mareo.
      DAMAGE_RESISTANCE: <#cccccc>Reduce el daño recibido.
      DARKNESS: <#cccccc>Oscurece la visión del jugador.
      DOLPHINS_GRACE: <#cccccc>Aumenta la velocidad de natación.
      FAST_DIGGING: <#cccccc>Aumenta la velocidad de minería.
      FIRE_RESISTANCE: <#cccccc>Otorga inmunidad al fuego y a la lava.
      GLOWING: <#cccccc>Resalta el contorno del jugador.
      HARM: <#cccccc>Inflige daño instantáneamente.
      HEAL: <#cccccc>Restaura la salud instantáneamente.
      HEALTH_BOOST: <#cccccc>Añade corazones de salud adicionales.
      HERO_OF_THE_VILLAGE: <#cccccc>Descuentos con los aldeanos.
      HUNGER: <#cccccc>Agota el hambre más rápido.
      INCREASE_DAMAGE: <#cccccc>Aumenta el daño cuerpo a cuerpo.
      INFESTED: <#cccccc>Genera lepisma al recibir daño.
      INVISIBILITY: <#cccccc>Hace al jugador invisible.
      JUMP: <#cccccc>Aumenta la altura de salto.
      LEVITATION: <#cccccc>Hace que el jugador flote hacia arriba.
      LUCK: <#cccccc>Aumenta la suerte.
      NIGHT_VISION: <#cccccc>Permite ver en la oscuridad.
      OOZING: <#cccccc>Genera slimes al morir.
      POISON: <#cccccc>Inflige daño gradualmente (no puede matar).
      RAID_OMEN: <#cccccc>Desencadena una incursión al acercarse a una aldea.
      REGENERATION: <#cccccc>Restaura la salud gradualmente.
      SATURATION: <#cccccc>Restaura el hambre instantáneamente.
      SLOW: <#cccccc>Disminuye la velocidad de movimiento.
      SLOW_DIGGING: <#cccccc>Disminuye la velocidad de minería.
      SLOW_FALLING: <#cccccc>Ralentiza la velocidad de caída.
      SPEED: <#cccccc>Aumenta la velocidad de movimiento.
      TRIAL_OMEN: <#cccccc>Aumenta la dificultad de las pruebas.
      UNLUCK: <#cccccc>Disminuye la suerte.
      WATER_BREATHING: <#cccccc>Permite respirar bajo el agua.
      WEAKNESS: <#cccccc>Reduce el daño infligido.
      WEAVING: <#cccccc>Genera telarañas al morir.
      WIND_CHARGED: <#cccccc>Desencadena una ráfaga de viento al morir.
      WITHER: <#cccccc>Inflige daño gradualmente (puede matar).
