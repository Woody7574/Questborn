      title: '{prefix}<#cccccc>Заголовок: <#ffffff>{title}'
      dialogue: '{prefix}<#cccccc>Диалог: <#ffffff>{dialogue}'
      indicator: '{prefix}<#cccccc>Смещение индикатора: <#ffffff>{offset}'
    dialogue-removed: '{prefix}<#97e673>Диалог удален у NPC <#ffffff>{npc}'
    dialogue-not-found: '{prefix}<#e07a5f>Диалог не найден: <#ffffff>{dialogue}'
    dialogue-set: '{prefix}<#97e673>Для NPC <#ffffff>{npc}<#97e673> установлен диалог
      <#ffffff>{dialogue}'
    indicator-set: '{prefix}<#97e673>Смещение индикатора для NPC <#ffffff>{npc}<#97e673>
      установлено на <#ffffff>{offset}'
    voice-set: '{prefix}<#97e673>Голос печати для NPC <#ffffff>{npc}<#97e673> установлен
      на <#ffffff>{voice}'
    voice-removed: '{prefix}<#97e673>Голос печати удален у NPC <#ffffff>{npc}'
    console-must-specify-id: '{prefix}<#e07a5f>Консоль должна указать ID NPC.'
    not-looking-at-npc: '{prefix}<#e07a5f>Не удалось идентифицировать NPC. Пожалуйста,
      посмотрите на NPC или укажите ID.'
    link-pending: '{prefix}<#97e673>Пожалуйста, нажмите ПКМ по NPC, чтобы привязать
      его.'
    unlink-pending: '{prefix}<#e07a5f>Пожалуйста, нажмите ПКМ по NPC, чтобы отвязать
      его.'
    bind-success: '{prefix}<#97e673>Успешно привязано <#ffffff>{target}<#97e673> к'
    unbind-success: '{prefix}<#e07a5f>Успешно отвязано <#ffffff>{target}<#e07a5f>
      от NPC <#ffffff>{npc}'
  activate:
    success: '{prefix}<#97e673>Квест <#ffffff>{quest}<#97e673> активирован для игрока
      <#ffffff>{player}.'
    fail: '{prefix}<#e07a5f>Не удалось активировать квест <#ffffff>{quest}<#e07a5f>.'
  details:
    no-active-quest: '{prefix}<#cccccc>У вас нет активного квеста.'
  deactivate:
    no-active: '{prefix}<#cccccc>У игрока нет активного квеста.'
