    displayname-set: '{prefix}<#97e673>Имя для NPC <#ffffff>{npc}<#97e673> установлено
      на: <#ffffff>{name}'
    displayname-removed: '{prefix}<#97e673>Имя для NPC <#ffffff>{npc}<#97e673> удалено'
