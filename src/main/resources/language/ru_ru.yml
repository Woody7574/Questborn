        Привязать квест к NPC'
      remove: '  <#97e673>/quest npc remove <#a3a3a3><npcId> <#cccccc>- Удалить NPC'
      unlink: '  <#97e673>/quest npc unlink <#a3a3a3><category> <type> <id> <#cccccc>-
