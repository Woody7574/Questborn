      success: '{prefix}<#97e673>Этап квеста для игрока <#ffffff>{player}<#97e673>
        принудительно завершён.'
      no-stages: '{prefix}<#cccccc>У этого квеста нет этапов или этап не удалось завершить.'
  open:
    opened: '{prefix}<#97e673>Меню <#ffffff>{menu}<#97e673> открыто для игрока <#ffffff>{player}.'
  reset:
    cooldown-success: '{prefix}<#97e673>Кулдаун квеста <#ffffff>{quest}<#97e673> сброшен
      для игрока <#ffffff>{player}<#97e673>.'
    history-success: '{prefix}<#97e673>История выполнения квеста <#ffffff>{quest}<#97e673>
      сброшена для игрока <#ffffff>{player}<#97e673>.'
    reward-success: '{prefix}<#97e673>Статус награды квеста <#ffffff>{quest}<#97e673>
      сброшен для игрока <#ffffff>{player}<#97e673>.'
    rotation-success: '{prefix}<#97e673>Данные ротации для типа <#ffffff>{type}<#97e673>
      сброшены для игрока <#ffffff>{player}<#97e673>.'
    quest-success: '{prefix}<#97e673>Все данные квеста <#ffffff>{quest}<#97e673> сброшены
      для игрока <#ffffff>{player}<#97e673>.'
    type-success: '{prefix}<#97e673>Все данные для типа квестов <#ffffff>{type}<#97e673>
      сброшены для игрока <#ffffff>{player}<#97e673>.'
    top-success: '{prefix}<#97e673>Данные топа для типа <#ffffff>{type}<#97e673> сброшены для игрока <#ffffff>{player}<#97e673>.'
    top-success-all: '{prefix}<#97e673>Сброс топа завершен! Изменено <#ffffff>{count}<#97e673> игроков.'
    top-start: '{prefix}<#97e673>Начало сброса топа для типа <#ffffff>{type}<#97e673>...'

  errors:
    console-specify-player: '{prefix}<#e07a5f>Консоль должна указать игрока.'
    quest-wrong-type: '{prefix}<#e07a5f>Квест <#ffffff>{quest}<#e07a5f> не принадлежит к типу <#ffffff>{type}<#e07a5f>.'
    unknown-command: '{prefix}<#e07a5f>Неизвестная команда. Введите /quest help'
    invalid-syntax: '{prefix}<#e07a5f>Неверный синтаксис! Использование: <#97e673>{command}
      <#a3a3a3>{syntax}'
    quest-not-found: '{prefix}<#e07a5f>Квест <#ffffff>{quest}<#e07a5f> не существует.'
    player-not-found: '{prefix}<#e07a5f>Игрок с именем <#ffffff>{player}<#e07a5f>
      не найден!'
    top-reset-error: '{prefix}<#e07a5f>Ошибка сброса топа: {error}'

  global:
    usage-header: <#7dd3ff><strikethrough>----</strikethrough> <#ffffff>Глобальные
      квесты <#7dd3ff><strikethrough>----</strikethrough>
