prefix: <#e9c46a><bold>Questborn</bold> <#8a8a8a>• <reset>
hud:
  actionbar:
    complete-message: <#99ff9d>Квест {quest_name} <#99ff9d>выполнен!
commands:
  no-permission: '{prefix}<#e07a5f>У вас нет прав для этого действия.'
  finish-global:
    not-global: '{prefix}<#e07a5f>Квест <#ffffff>{quest} <#e07a5f>не является глобальным
      квестом.'
    not-active: '{prefix}<#cccccc>Глобальный квест <#ffffff>{quest} <#cccccc>не активирован
      или уже завершен.'
    success: '{prefix}<#97e673>Глобальный квест <#ffffff>{quest} <#97e673>был принудительно
      завершен!'
  reset-global:
