      сброшен. Прогресс очищен, а перезарядка у онлайн игроков обнулена.'
  npc-only: '{prefix}<#cccccc>Эта команда недоступна.'
  reload:
    done: '{prefix}<#97e673>Все конфигурации плагина успешно перезагружены!'
  help:
    header: <#7dd3ff><strikethrough>----</strikethrough><#ffffff> Помощь по командам
      Questborn <#7dd3ff><strikethrough>----</strikethrough>
    footer: <#7dd3ff>Страница {page} из {total_pages} <#a3a3a3>({total_results} команд)
    hover-no-perm: <#a7ff99>Нажмите, чтобы вставить в чат
    hover-with-perm: '<#a7ff99>Нажмите, чтобы вставить в чат

      <#ffcc66>Право: <#ffffff>{permission}'
  effect:
    list-header: <#7dd3ff><strikethrough>----</strikethrough><#ffffff> Доступные эффекты
      <#7dd3ff><strikethrough>----</strikethrough>
    list-footer: <#7dd3ff>Страница {page} из {total_pages} <#a3a3a3>({total_results}
      эффектов)
    no-effects: '{prefix}<#cccccc>Эффекты отсутствуют.'
    not-found: '{prefix}<#e07a5f>Эффект <#ffffff>{effect}<#e07a5f> не найден.'
    success-self: '{prefix}<#97e673>Вы воспроизвели эффект <#ffffff>{effect}<#97e673>
      на себе.'
    success-other: '{prefix}<#97e673>Вы воспроизвели эффект <#ffffff>{effect}<#97e673>
      на игроке <#ffffff>{player}<#97e673>.'
    received: '{prefix}<#97e673>На вас воспроизвели эффект <#ffffff>{effect}<#97e673>.'
  npc:
    usage-header: <#7dd3ff><strikethrough>----</strikethrough> <#ffffff>Команды NPC
      <#7dd3ff><strikethrough>----</strikethrough>
    help:
      dialogue: '  <#97e673>/quest npc dialogue <#a3a3a3><npcId> <dialogueId> <#cccccc>-
        Привязать диалог к NPC'
      displayname: '  <#97e673>/quest npc displayname <#a3a3a3><npcId> <name> <#cccccc>-
        Изменить имя NPC'
      gui-title: '  <#97e673>/quest npc gui-title <#a3a3a3><npcId> <title> <#cccccc>-
        Заголовок GUI NPC'
      indicator: '  <#97e673>/quest npc indicator <#a3a3a3><npcId> <offset> <#cccccc>-
        Высота индикатора'
      info: '  <#97e673>/quest npc info <#a3a3a3>[npcId] <#cccccc>- Информация о NPC'
