prefix: <#e9c46a><bold>Questborn</bold> <#8a8a8a>• <reset>
hud:
  actionbar:
    complete-message: <#99ff9d>Quest {quest_name} <#99ff9d>completed!
commands:
  no-permission: '{prefix}<#e07a5f>You do not have permission for this action.'
  finish-global:
    not-global: '{prefix}<#e07a5f>Quest <#ffffff>{quest} <#e07a5f>is not a global
      quest.'
    not-active: '{prefix}<#cccccc>Global quest <#ffffff>{quest} <#cccccc>is not active
      or already finished.'
    success: '{prefix}<#97e673>Global quest <#ffffff>{quest} <#97e673>has been forcefully
      completed!'
  reset-global:
    not-global: '{prefix}<#e07a5f>Quest <#ffffff>{quest} <#e07a5f>is not a global
      quest.'
    success: '{prefix}<#97e673>Global quest <#ffffff>{quest} <#97e673>has been completely
      reset. Global progress wiped and online players'' cooldowns reset.'
  npc-only: '{prefix}<#cccccc>This command is not available.'
  reload:
    done: '{prefix}<#97e673>All plugin configurations successfully reloaded!'
  help:
    header: <#7dd3ff><strikethrough>----</strikethrough><#ffffff> Questborn Command
      Help <#7dd3ff><strikethrough>----</strikethrough>
    footer: <#7dd3ff>Page {page} of {total_pages} <#a3a3a3>({total_results} commands)
    hover-no-perm: <#a7ff99>Click to insert into chat
    hover-with-perm: '<#a7ff99>Click to insert into chat

      <#ffcc66>Permission: <#ffffff>{permission}'
  effect:
    list-header: <#7dd3ff><strikethrough>----</strikethrough><#ffffff> Available Effects
      <#7dd3ff><strikethrough>----</strikethrough>
    list-footer: <#7dd3ff>Page {page} of {total_pages} <#a3a3a3>({total_results} effects)
    no-effects: '{prefix}<#cccccc>No effects available.'
    not-found: '{prefix}<#e07a5f>Effect <#ffffff>{effect}<#e07a5f> not found.'
    success-self: '{prefix}<#97e673>Played effect <#ffffff>{effect}<#97e673> on yourself.'
    success-other: '{prefix}<#97e673>Played effect <#ffffff>{effect}<#97e673> on player
      <#ffffff>{player}<#97e673>.'
    received: '{prefix}<#97e673>Played effect <#ffffff>{effect}<#97e673> on you.'
  npc:
    usage-header: <#7dd3ff><strikethrough>----</strikethrough> <#ffffff>NPC Commands
      <#7dd3ff><strikethrough>----</strikethrough>
    help:
      dialogue: '  <#97e673>/quest npc dialogue <#a3a3a3><npcId> <dialogueId> <#888888>-
        Link dialogue to NPC'
      displayname: '  <#97e673>/quest npc displayname <#a3a3a3><npcId> <name> <#888888>-
        Set NPC display name'
      gui-title: '  <#97e673>/quest npc gui-title <#a3a3a3><npcId> <title> <#888888>-
        Set NPC GUI title'
      indicator: '  <#97e673>/quest npc indicator <#a3a3a3><npcId> <offset> <#888888>-
        Indicator height offset'
      info: '  <#97e673>/quest npc info <#a3a3a3>[npcId] <#888888>- View NPC info'
      link: '  <#97e673>/quest npc link <#a3a3a3><category> <type> <id> <#888888>-
        Link quest to NPC'
      remove: '  <#97e673>/quest npc remove <#a3a3a3><npcId> <#888888>- Remove NPC
        from config'
      unlink: '  <#97e673>/quest npc unlink <#a3a3a3><category> <type> <id> <#888888>-
        Unlink quest from NPC'
      voice: '  <#97e673>/quest npc voice <#a3a3a3><npcId> <voice> <#888888>- Set
        NPC voice'
    list-header: <#7dd3ff>&m----<#ffffff> Configured NPCs <#7dd3ff>&m----
    list-empty: '{prefix}<#cccccc>No NPCs configured.'
    list-item: '{prefix}<#97e673>- <#ffffff>{npc}'
    remove-success: '{prefix}<#97e673>Successfully removed NPC configuration for <#ffffff>{npc}'
    gui-title-set: '{prefix}<#97e673>Set GUI title for NPC <#ffffff>{npc}<#97e673>
      to <#ffffff>{title}'
    displayname-set: '{prefix}<#97e673>Display name for NPC <#ffffff>{npc}<#97e673>
      set to: <#ffffff>{name}'
    displayname-removed: '{prefix}<#97e673>Display name removed for NPC <#ffffff>{npc}'
    info:
      header: '<#7dd3ff>&m----<#ffffff> NPC Info: {npc} <#7dd3ff>&m----'
      title: '{prefix}<#cccccc>GUI Title: <#ffffff>{title}'
      dialogue: '{prefix}<#cccccc>Dialogue: <#ffffff>{dialogue}'
      indicator: '{prefix}<#cccccc>Indicator Offset: <#ffffff>{offset}'
    dialogue-removed: '{prefix}<#97e673>Removed dialogue from NPC <#ffffff>{npc}'
    dialogue-not-found: '{prefix}<#e07a5f>Dialogue not found: <#ffffff>{dialogue}'
    dialogue-set: '{prefix}<#97e673>Set dialogue for NPC <#ffffff>{npc}<#97e673> to
      <#ffffff>{dialogue}'
    indicator-set: '{prefix}<#97e673>NPC <#ffffff>{npc}<#97e673> indicator offset
      set to <#ffffff>{offset}'
    voice-set: '{prefix}<#97e673>Set typing voice for NPC <#ffffff>{npc}<#97e673>
      to <#ffffff>{voice}'
    voice-removed: '{prefix}<#97e673>Removed typing voice from NPC <#ffffff>{npc}'
    console-must-specify-id: '{prefix}<#e07a5f>Console must specify NPC ID.'
    not-looking-at-npc: '{prefix}<#e07a5f>Could not identify NPC. Please look at an
      NPC or provide ID.'
    link-pending: '{prefix}<#97e673>Please right-click an NPC to bind it.'
    unlink-pending: '{prefix}<#e07a5f>Please right-click an NPC to unbind it.'
    bind-success: '{prefix}<#97e673>Successfully bound <#ffffff>{target}<#97e673>'
    unbind-success: '{prefix}<#e07a5f>Successfully unbound <#ffffff>{target}<#e07a5f>
      from NPC <#ffffff>{npc}'
  activate:
    success: '{prefix}<#97e673>Quest <#ffffff>{quest}<#97e673> activated for player
      <#ffffff>{player}.'
    fail: '{prefix}<#e07a5f>Failed to activate quest <#ffffff>{quest}<#e07a5f>.'
  details:
    no-active-quest: '{prefix}<#cccccc>You have no active quest.'
  deactivate:
    no-active: '{prefix}<#cccccc>The player has no active quest.'
    success: '{prefix}<#97e673>Active quest for <#ffffff>{player}<#97e673> deactivated.'
  finish:
    no-active: '{prefix}<#cccccc>The player has no active quest.'
    success: '{prefix}<#97e673>Quest for <#ffffff>{player}<#97e673> completed.'
    stage:
      success: '{prefix}<#97e673>Stage of the quest for <#ffffff>{player}<#97e673>
        force-completed.'
      no-stages: '{prefix}<#cccccc>This quest has no stages or the stage could not
        be completed.'
  open:
    opened: '{prefix}<#97e673>Menu <#ffffff>{menu}<#97e673> opened for player <#ffffff>{player}.'
  reset:
    cooldown-success: '{prefix}<#97e673>Cooldown for quest <#ffffff>{quest}<#97e673>
      reset for player <#ffffff>{player}<#97e673>.'
    history-success: '{prefix}<#97e673>Completion history for quest <#ffffff>{quest}<#97e673>
      reset for player <#ffffff>{player}<#97e673>.'
    reward-success: '{prefix}<#97e673>Reward status for quest <#ffffff>{quest}<#97e673>
      reset for player <#ffffff>{player}<#97e673>.'
    rotation-success: '{prefix}<#97e673>Rotation data for type <#ffffff>{type}<#97e673>
      reset for player <#ffffff>{player}<#97e673>.'
    quest-success: '{prefix}<#97e673>Full data for quest <#ffffff>{quest}<#97e673>
      reset for player <#ffffff>{player}<#97e673>.'
    type-success: '{prefix}<#97e673>All data for quest type <#ffffff>{type}<#97e673>
      reset for player <#ffffff>{player}<#97e673>.'
    top-success: '{prefix}<#97e673>Top data for type <#ffffff>{type}<#97e673> reset for player <#ffffff>{player}<#97e673>.'
    top-success-all: '{prefix}<#97e673>Top reset complete! Modified <#ffffff>{count}<#97e673> players.'
    top-start: '{prefix}<#97e673>Starting top reset for type <#ffffff>{type}<#97e673>...'

  errors:
    console-specify-player: '{prefix}<#e07a5f>Console must specify a player.'
    quest-wrong-type: '{prefix}<#e07a5f>Quest <#ffffff>{quest}<#e07a5f> does not belong
      to type <#ffffff>{type}<#e07a5f>.'
    unknown-command: '{prefix}<#e07a5f>Unknown command. Type /quest help'
    invalid-syntax: '{prefix}<#e07a5f>Invalid syntax! Usage: <#97e673>{command} <#a3a3a3>{syntax}'
    quest-not-found: '{prefix}<#e07a5f>Quest <#ffffff>{quest}<#e07a5f> does not exist.'
    player-not-found: '{prefix}<#e07a5f>Player with name <#ffffff>{player}<#e07a5f>
      was not found!'
    top-reset-error: '{prefix}<#e07a5f>Error resetting top: {error}'

  global:
    usage-header: <#7dd3ff><strikethrough>----</strikethrough> <#ffffff>Global Quests
      <#7dd3ff><strikethrough>----</strikethrough>
    help:
      finish: '  <#97e673>/quest finish global <#a3a3a3><questId> <#888888>- Force
        complete global quest'
      reset: '  <#97e673>/quest reset global <#a3a3a3><questId> <#888888>- Reset global
        quest progress'
      top: '  <#97e673>/quest top <#a3a3a3>[questId] <#888888>- Global quest leaderboard'
