# Унікальний ідентифікатор цього типу квестів
id: example

# Папка, де зберігаються квести цього типу
folder: quests/example

# Назва для відображення плитки типу в головному меню
display-name: <#7dd3ff>Приклад типу

# Опціонально: Замінює стандартний заголовок GUI для цього типу квестів.
gui-type-title: '&0Приклад | &f{page}/{total}'

# Опціонально: Замінює стандартний заголовок деталей квеста.
gui-quest-title: '&0{quest}'

# Опціонально: Замінює стандартний заголовок передачі предметів.
gui-transfer-title: '&0{quest}'

# Опис у GUI
lore:
- <#cccccc>Категорія квестів.
- ''
- '<#a7ff99>Прогрес:'
- ' <#a7ff99>✔ <#ffffff>{cooldown}/{total} <#cccccc>завершено'
- ''
- <#7dd3ff>Натисніть, щоб відкрити

# Матеріал іконки в GUI
material: SLIME_SPAWN_EGG
# Позиція слота в головному меню
slot: 13

# Режим роботи движка квестів
# Виберіть, як поводяться квести цієї категорії:
# - DEFAULT: Всі квести завжди доступні, обробляються окремо.
# - CHAIN: Гравець відкриває наступний квест лише після завершення попереднього.
# - ROTATION: Гравець отримує N випадкових квестів, які скидаються періодично.
engine: DEFAULT

# Кулдаун між окремими квестами в секундах (лише для DEFAULT)
cooldown-seconds: 3600

# Опціонально: Вимоги для розблокування цього типу квестів
requirements:
  permission: questborn.vip

# Опціонально: Опис вимог у GUI, якщо тип заблоковано
requirements-lore:
- <#ff9999>Потрібен ранг VIP
- ' <#cccccc>• <#ffffff>Придбати на store.example.com'

# Встановіть false, щоб повністю вимкнути цей тип квестів (плагін його не завантажить)
enabled: false
