plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'ua.woody'
version = '2.0.4'
project.archivesBaseName = 'Questborn'

repositories {
    mavenCentral()
    maven { url = "https://jitpack.io" }

    maven {
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }

    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        url = "https://maven.enginehub.org/repo/"
    }

    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }

    maven {
        url = "https://repo.codemc.org/repository/maven-public/"
    }

    maven {
        url = "https://repo.citizensnpcs.co/"
    }

    maven {
        url = "https://repo.aikar.co/content/groups/aikar/"
    }

    maven {
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }

    maven {
        url = "https://repo.fancyinnovations.com/releases"
    }

    maven {
        url = "https://repo.momirealms.net/releases/"
    }
}

dependencies {
    implementation 'com.github.TechnicallyCoded:FoliaLib:0.4.4'
    implementation 'fr.mrmicky:fastboard:2.2.1'
    implementation 'dev.triumphteam:triumph-gui:3.1.10'

    compileOnly "com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT"
    implementation 'net.kyori:adventure-text-minimessage:4.17.0'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.17.0'
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'

    compileOnly "org.mongodb:mongodb-driver-sync:4.11.1"

    compileOnly "org.apache.logging.log4j:log4j-api:2.17.1"
    compileOnly "org.apache.logging.log4j:log4j-core:2.17.1"

    compileOnly "com.github.MilkBowl:VaultAPI:1.7"

    compileOnly "me.clip:placeholderapi:2.11.6"

    compileOnly "com.sk89q.worldedit:worldedit-bukkit:7.2.17"

    compileOnly "com.sk89q.worldguard:worldguard-bukkit:7.0.5"

    compileOnly "net.citizensnpcs:citizensapi:2.0.30-SNAPSHOT"

    compileOnly "de.oliver:FancyNpcs:2.4.3"

    compileOnly "net.momirealms:craft-engine-bukkit:26.7.4"
    compileOnly "net.momirealms:craft-engine-core:26.7.4"

    compileOnly 'com.google.code.gson:gson:2.10.1'

    implementation 'com.zaxxer:HikariCP:5.1.0'

    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'

    compileOnly 'com.h2database:h2:2.1.214'

    compileOnly 'org.postgresql:postgresql:42.7.3'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

def targetJavaVersion = 16
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

compileJava {
    options.compilerArgs += ["-parameters"]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    relocate 'net.kyori', 'ua.woody.questborn.libs.kyori'
    relocate 'com.tcoded.folialib', 'ua.woody.questborn.libs.folialib'
    relocate 'com.tcoded', 'ua.woody.questborn.libs.tcoded'
    relocate 'fr.mrmicky.fastboard', 'ua.woody.questborn.libs.fastboard'
    relocate 'dev.triumphteam.gui', 'ua.woody.questborn.libs.triumphgui'
    relocate 'com.zaxxer.hikari', 'ua.woody.questborn.libs.hikari'
    relocate 'co.aikar.commands', 'ua.woody.questborn.libs.acf'
    relocate 'co.aikar.locales', 'ua.woody.questborn.libs.locales'
    exclude 'dev/lone/**'

    exclude { details ->
        def name = details.name
        return (name.startsWith('acf-core_') || name.startsWith('acf-minecraft_')) && !name.endsWith('_en.properties')
    }

    archiveClassifier.set("")
}

build.dependsOn shadowJar

test {
    useJUnitPlatform()
}
